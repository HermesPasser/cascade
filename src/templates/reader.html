<!doctype html>
<html>
	<head>
		<title>{{ current.split('/') | last }} - Reader - Cascade</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='reader/css/base.css') }}" />
		<link rel="stylesheet" href="{{ url_for('static', filename='reader/css/imagecontainer.css') }}" />
	</head>

	<body onkeydown="onKeyDown(event)">
		<div id="imageWrapper" class="image-wrapper" onwheel="handleScroll(event)" onclick="handleClick(event)"></div>
		<div id="progressBar" class="progress-bar">
			{% for i in pages %}
			<button onclick="changePage(parseInt('{{ loop.index - 1 }}'))">{{ loop.index }}</button>
			{% endfor %}
		</div>
		<div id="controls" class="controls">
			<div class="controls-close-wrapper">
				<button onclick="controls.classList.toggle('closed')">X</button>
			</div>
			<span> <a href="/picker?path={{ parent }}">↖️</a> {{ current.split('/') | last }} </span>
			<div class="controls-navigator">
				<button onclick="previousImage(event)" class="control-input">&lt;</button>
				<select id="pageSelector" onchange="changePageFromSelector()" class="control-input">
					{% for i in pages %}
					<option id="option-img-{{ loop.index }}">{{ loop.index }}</option>
					{% endfor %}
				</select>
				<button onclick="nextImage(event)" class="control-input">&gt;</button>
			</div>
			<div class="controls-navigator">
				<button onclick="previousEntry()" class="control-input">&lt;</button>
				<select id="entrySelector" onchange="changeEntry(event.target.value)" class="control-input">
					{% for entry in entries %}
					<option {{ "selected" if current == entry.absolute else "" }} value="{{ entry.absolute }}">
						{{ entry.name }}
					</option>
					{% endfor %}
				</select>
				<button onclick="nextEntry()" class="control-input">&gt;</button>
			</div>
			<button id="modeButton" onclick="toogleMode()" class="control-input big">Mode: Singe Page</button>
			<button id="sizeButton" onclick="toogleSize()" class="control-input big">Size:</button>
			<button id="progressButton" onclick="toogleProgress()" class="control-input big">
				Progress bar: visible
			</button>
			 <button id="fullscreenButton" onclick="fullscreen()">Fullscreen: Disabled</button>
			<button onclick="configDialog.showModal()" class="control-input">Extra settings</button>
			</button>
		</div>
		<dialog id="configDialog">
			<label>
				Page Gap
				<input
					type="range"
					value="0"
					min="0"
					max="20"
					onclick="
						padding(event.target.value);
						paddingPixels.innerText = event.target.value + 'px';
					"
				/>
				(<span id="paddingPixels">0px</span>)
			</label>

			<label>
				Background color
				<input
					value="#ffffff"
					id="colorInput"
					onchange="root.style.setProperty('--background', event.target.value)"
					type="color"
				/>
			</label>

			<label>
				Comic path
				<input disabled title="{{ current }}" value="{{ current }}"/>
			</label>

			<button onclick="configDialog.close()">Close</button>
		</dialog>
		<script id="imagesJson" type="application/json">
			{{ pages|tojson }}
		</script>
		<script>
			// Flask will only replace on the files actually its render
			// so we need to 'store' those values on globals so the js can
			// access it
			var CURRENT_FOLDER = '{{ current }}'
		</script>
		<script src="{{ url_for('static', filename='reader/js/index.js') }}"></script>
	</body>
</html>
